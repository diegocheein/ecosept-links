  <style>
    :root {
      --bg: #eaf1f8;
      --bg-2: #ffffff;
      --card: #ffffff;
      --ink: #0d1b2a;
      --ink-soft: #5b6b7f;
      --accent: #347b4c;
      --accent-ink: #ffffff;
      --border: #dbe4ee;
      --ring: rgba(52, 123, 76, 0.20);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      color: var(--ink);
      background: linear-gradient(160deg, #4f9a63 0%, #347b4c 45%, #1f5232 100%);
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* the floating card */
    .wrap {
      position: relative;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 34px 24px 30px;
      border-radius: 28px;
      background: transparent;
    }

    .logo {
      margin: 8px 0 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    .logo img { display: block; width: min(280px, 78%); height: auto; }

    .visually-hidden {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .bio {
      color: var(--ink-soft);
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      margin-bottom: 18px;
    }

    /* social icons row */
    .socials {
      display: flex;
      gap: 24px;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
    }
    .socials a {
      color: #ffffff;
      display: grid;
      place-items: center;
      transition: transform .15s ease, color .15s ease;
    }
    .socials a:hover { transform: translateY(-2px); opacity: .85; }
    .socials a svg { width: 27px; height: 27px; }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #ffffff;
      color: var(--ink);
      text-decoration: none;
      padding: 17px 20px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,0.7);
      font-weight: 600;
      font-size: 15.5px;
      box-shadow: 0 4px 14px rgba(10,40,20,0.22);
      transition: transform .16s ease, box-shadow .16s ease;
    }
    .link:hover {
      transform: scale(1.015);
      box-shadow: 0 10px 24px rgba(10,40,20,0.30);
    }
    .link svg { width: 20px; height: 20px; color: var(--accent); flex: 0 0 auto; }

    footer {
      margin-top: 22px;
      color: rgba(255,255,255,0.78);
      font-size: 12px;
      text-align: center;
      line-height: 1.6;
    }
    footer a { color: #fff; text-decoration: none; }

    /* ---- Share button ---- */
    .share-btn {
      position: fixed;
      top: 18px;
      right: 18px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.14);
      color: #ffffff;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(20,45,80,0.12);
      transition: transform .15s ease, box-shadow .15s ease;
      z-index: 20;
    }
    .share-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(13,27,42,0.14); }
    .share-btn svg { width: 20px; height: 20px; }

    /* ---- Modal ---- */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(13,27,42,0.55);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
      z-index: 50;
      padding: 0;
    }
    .overlay.open { opacity: 1; pointer-events: auto; }

    .sheet {
      background: #fff;
      width: 100%;
      max-width: 520px;
      border-radius: 22px 22px 0 0;
      padding: 20px 22px 28px;
      transform: translateY(30px);
      transition: transform .25s ease;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.25);
    }
    .overlay.open .sheet { transform: translateY(0); }
    @media (min-width: 600px) {
      .overlay { align-items: center; }
      .sheet { border-radius: 22px; }
    }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 18px;
    }
    .sheet-head h2 { font-size: 17px; font-weight: 700; color: var(--ink); }
    .sheet-close {
      position: absolute;
      right: 0;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--ink-soft);
      font-size: 22px;
      line-height: 1;
      padding: 4px;
    }

    /* preview card */
    .preview {
      background:
        linear-gradient(160deg, #4f9a63 0%, #347b4c 50%, #1f5232 100%);
      border: none;
      border-radius: 18px;
      padding: 30px 20px 26px;
      text-align: center;
      color: var(--ink);
      margin-bottom: 22px;
    }
    .preview .mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
    }
    .preview .mark img { display: block; width: 230px; max-width: 66%; height: auto; }
    .preview .name { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; color: #fff; }
    .preview .handle { font-size: 14px; color: var(--ink-soft); margin-top: 4px; }

    /* share options: rows that wrap, nothing gets cut */
    .share-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px 10px;
      padding: 2px 0 4px;
    }
    .share-opt {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: none;
      border: none;
      cursor: pointer;
      width: 68px;
      text-decoration: none;
      color: var(--ink);
    }
    .share-opt .bubble {
      width: 56px; height: 56px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
    }
    .share-opt .bubble svg { width: 26px; height: 26px; }
    .share-opt .lbl { font-size: 12px; color: var(--ink-soft); text-align: center; line-height: 1.2; }

    .b-copy   { background: #e9edf2; color: #45566a; }
    .b-x      { background: #000000; }
    .b-fb     { background: #1877f2; }
    .b-wa     { background: #25d366; }
    .b-in     { background: #0a66c2; }
    .b-msg    { background: linear-gradient(45deg,#00b2ff,#a033ff,#ff5280); }
    .b-tg     { background: #29a9eb; }
    .b-snap   { background: #fffc00; color: #000; }
    .b-mail   { background: #347b4c; }

    /* toast */
    .toast {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink);
      color: #fff;
      padding: 11px 20px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
      z-index: 60;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>

      var headerLogo = document.querySelector('.logo img');
      var shareLogo = document.getElementById('shareLogo');
      if (headerLogo && shareLogo) shareLogo.src = headerLogo.src;
    })();

    (function () {
      var overlay = document.getElementById('shareOverlay');
      var openBtn = document.getElementById('openShare');
      var closeBtn = document.getElementById('closeShare');
      var toast = document.getElementById('toast');

      var pageUrl = window.location.href;
      var shareTitle = 'Ecosept — Tratamiento biológico de cloacas y pozos';
      var u = encodeURIComponent(pageUrl);
      var t = encodeURIComponent(shareTitle);

      // Build share links
      var links = {
        x: 'https://twitter.com/intent/tweet?url=' + u + '&text=' + t,
        facebook: 'https://www.facebook.com/sharer/sharer.php?u=' + u,
        whatsapp: 'https://wa.me/?text=' + t + '%20' + u,
        linkedin: 'https://www.linkedin.com/sharing/share-offsite/?url=' + u,
        messenger: 'https://www.facebook.com/dialog/send?link=' + u + '&redirect_uri=' + u + '&app_id=0',
        telegram: 'https://t.me/share/url?url=' + u + '&text=' + t,
        snapchat: 'https://www.snapchat.com/scan?attachmentUrl=' + u,
        email: 'mailto:?subject=' + t + '&body=' + t + '%20' + u
      };
      document.querySelectorAll('#shareRow [data-share]').forEach(function (el) {
        var k = el.getAttribute('data-share');
        if (links[k]) el.setAttribute('href', links[k]);
      });

      function open() {
        // Native share sheet on mobile if available
        if (navigator.share && window.matchMedia('(max-width: 600px)').matches) {
          navigator.share({ title: shareTitle, url: pageUrl }).catch(function () { overlay.classList.add('open'); });
          return;
        }
        overlay.classList.add('open');
      }
      function close() { overlay.classList.remove('open'); }

      openBtn.addEventListener('click', open);
      closeBtn.addEventListener('click', close);
      overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(function () { toast.classList.remove('show'); }, 1800);
      }

      document.querySelector('[data-share="copy"]').addEventListener('click', function () {
        function done() { showToast('¡Enlace copiado!'); }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(pageUrl).then(done).catch(fallback);
        } else { fallback(); }
        function fallback() {
          var i = document.createElement('input');
          i.value = pageUrl; document.body.appendChild(i); i.select();
          try { document.execCommand('copy'); done(); } catch (e) {}
          document.body.removeChild(i);
        }
      });
    })();
  </script>
</body>
</html>
